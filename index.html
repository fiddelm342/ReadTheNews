<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My News Briefing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <meta name="theme-color" content="#1e3a8a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <header class="bg-blue-900 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center border-b-[6px] border-[#ff9443]">
        <h1 class="text-lg font-bold tracking-tight flex items-center space-x-2">
            <span class="w-2 h-2 rounded-full bg-[#ff9443] animate-pulse shadow-[0_0_8px_#ff9443]"></span>
            <span>Audio News Briefing</span>
        </h1>
        <label class="flex items-center space-x-2 text-xs bg-blue-800 hover:bg-blue-700 px-3 py-1.5 rounded-lg border border-[#ff9443]/75 cursor-pointer select-none transition">
            <input type="checkbox" id="autoplay-toggle" class="w-4 h-4 text-[#ff9443] rounded border-slate-300 focus:ring-[#ff9443] focus:ring-offset-blue-900">
            <span class="font-medium text-white">Autoplay on Load</span>
        </label>
    </header>

    <main class="flex-1 max-w-xl w-full mx-auto p-4 space-y-6 pb-40">
        <section class="space-y-2">
            <div class="flex justify-between items-center">
                <h2 class="text-md font-semibold text-slate-600 uppercase tracking-wider text-xs">Your Playlist Order (Drag to Reorder)</h2>
                <span class="text-[10px] text-slate-400 bg-slate-200 px-2 py-0.5 rounded font-medium">Auto-advances tracks</span>
            </div>
            <div id="playlist-queue" class="space-y-2 min-h-[50px]"></div>
        </section>

        <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-md font-semibold mb-4 text-slate-600 uppercase tracking-wider text-xs border-b pb-2">Toggle & Choose Library</h2>
            <div id="library-container" class="space-y-6"></div>
        </section>
    </main>

    <footer id="audio-player-container" class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 p-4 shadow-xl hidden z-50">
        <div class="max-w-xl mx-auto flex flex-col space-y-3">
            <div class="flex justify-between items-start text-xs border-b border-slate-100 pb-2">
                <div class="truncate pr-4 flex flex-col">
                    <span id="now-playing-source" class="font-bold text-blue-900 text-xs tracking-wider">SOURCE</span>
                    <span id="now-playing-title" class="text-slate-600 truncate text-[11px] mt-0.5">Track Name</span>
                </div>
                <span id="now-playing-date" class="text-slate-400 shrink-0 text-[10px]"></span>
            </div>

            <div class="flex items-center justify-center space-x-6 py-1">
                <button id="btn-prev" class="p-2 text-slate-600 hover:text-blue-900 transition focus:outline-none" title="Previous Show">
                    <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button id="btn-rw10" class="p-2 text-slate-600 hover:text-blue-900 transition focus:outline-none flex flex-col items-center" title="Rewind 10s">
                    <svg class="w-6 h-6 fill-none stroke-current" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M12.5 8c-2.6 0-5 1.7-5.8 4.2-.8 2.5.2 5.3 2.5 6.7s5.4.6 7.1-1.6M6.5 12h1.2v-1.2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span class="text-[8px] font-bold -mt-1 font-mono">-10s</span>
                </button>
                <button id="btn-ff10" class="p-2 text-slate-600 hover:text-blue-900 transition focus:outline-none flex flex-col items-center" title="Forward 10s">
                    <svg class="w-6 h-6 fill-none stroke-current" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M11.5 8c2.6 0 5 1.7 5.8 4.2.8 2.5-.2 5.3-2.5 6.7s-5.4.6-7.1-1.6M17.5 12h-1.2v-1.2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span class="text-[8px] font-bold -mt-1 font-mono">+10s</span>
                </button>
                <button id="btn-next" class="p-2 text-slate-600 hover:text-blue-900 transition focus:outline-none" title="Next Show">
                    <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zm9-12h2v12h-2z"/></svg>
                </button>
            </div>

            <audio id="main-audio-player" controls class="w-full h-8 mt-1"></audio>
        </div>
    </footer>

    <script>
        const FULL_LIBRARY = [
            {
                category: "General & National News",
                shows: [
                    { id: "npr_now", name: "NPR News Now", url: "https://feeds.npr.org/500005/podcast.xml" },
                    { id: "npr_up", name: "NPR Up First", url: "https://feeds.npr.org/510318/podcast.xml" },
                    { id: "cnn_5", name: "CNN 5 Things", url: "https://feeds.megaphone.fm/WMHY2007701094" },
                    { id: "dw_newsbrief", name: "DW News Brief", url: "https://rss.dw.com/syndication/feeds/podcast_en_newsbrief.33191-mrss.xml" },
                    { id: "fox_hourly", name: "Fox News Hourly Report", url: "https://feeds.megaphone.fm/FOXM2252206613" },
                    { id: "fox_rundown", name: "Fox News Rundown", url: "https://feeds.feedburner.com/FromWashington" },
                    { id: "abc_hourly", name: "ABC News Update", url: "https://feeds.megaphone.fm/ESP9792844572" },
                    { id: "abc_start", name: "ABC News Start Here", url: "https://feeds.megaphone.fm/ESP8447327256" },
                    { id: "ap_newswatch", name: "AP NewsWatch", url: "https://audioboom.com/channels/5023446.rss" },
                    { id: "Reuters", name: "Reuters World News", url: "https://feeds.megaphone.fm/reutersworldnews" },
                    { id: "washpost_7", name: "The Washington Post - The 7", url: "https://feeds.acast.com/public/shows/the-7" },
                    { id: "nytimes_daily", name: "The New York Times - The Daily", url: "https://feeds.simplecast.com/54nAGcIl" }
                ]
            },
            {
                category: "Business, Tech & Finance",
                shows: [
                    { id: "wsj_whats", name: "WSJ What's News", url: "https://feeds.simplecast.com/BA5QWI2p" },
                    { id: "wsj_tech", name: "WSJ Tech News Briefing", url: "https://feeds.content.dowjones.io/public/rss/wsjtechnewsbriefing" },
                    { id: "bloomberg_day", name: "Bloomberg Daybreak US", url: "https://feeds.bloomberg.fm/BLM2011036357" },
                    { id: "bloomberg_flash", name: "Bloomberg Business Flash", url: "https://feeds.bloomberg.fm/BLM5550269372" },
                    { id: "ft_brief", name: "FT News Briefing", url: "https://feeds.acast.com/public/shows/ft-news-briefing" },
                    { id: "cnbc_techck", name: "CNBC Tech Check", url: "https://podcast.cnbc.com/tech-check.xml" },
                    { id: "cnbc_markets", name: "CNBC Markets Express", url: "https://feeds.megaphone.fm/cnbc-markets-express" },
                    { id: "marketwatch", name: "MarketWatch Minute", url: "https://feeds.megaphone.fm/marketwatch-minute-briefing" },
                    { id: "techcrunch", name: "The TechCrunch Podcast", url: "https://feeds.megaphone.fm/techcrunch-podcast" },
                    { id: "cnet_news", name: "CNET News", url: "https://feeds.megaphone.fm/cnet-news" }
                ]
            },
            {
                category: "Global & Specialty Perspectives",
                shows: [
                    { id: "bbc_global", name: "BBC World Service Global News", url: "https://podcasts.files.bbci.co.uk/p02nq0gn.rss" },
                    { id: "bbc_minute", name: "BBC Minute", url: "https://podcasts.files.bbci.co.uk/p035w97g.rss" },
                    { id: "reuters_world", name: "Reuters World News Digest", url: "https://feeds.audiomeans.fr/s/p/reuters-world-news-digest" },
                    { id: "reuters_biz", name: "Reuters Business Briefing", url: "https://feeds.audiomeans.fr/s/p/reuters-business-briefing" },
                    { id: "economist_radio", name: "The Economist Radio", url: "https://feeds.acast.com/public/shows/06757b1c-99d7-5509-b68b-59d8fa7da85f" },
                    { id: "pbs_hour", name: "PBS NewsHour Full Show Audio", url: "https://rss.art19.com/pbs-newshour-full-show" }
                ]
            },
            {
                category: "Sports & Entertainment",
                shows: [
                    { id: "espn_flash", name: "ESPN SportsCenter Flash", url: "https://feeds.megaphone.fm/ESP4170327170" },
                    { id: "cbs_sports", name: "CBS Sports Minute", url: "https://feeds.megaphone.fm/cbssportsminute" },
                    { id: "nbc_pft", name: "NBC Sports Pro Football Talk", url: "https://feeds.megaphone.fm/profootballtalk" },
                    { id: "thr_news", name: "The Hollywood Reporter News", url: "https://feeds.megaphone.fm/thr-news" },
                    { id: "billboard", name: "Billboard News", url: "https://feeds.megaphone.fm/billboard-news" }
                ]
            }
        ];

        const SHOW_LOOKUP = {};
        FULL_LIBRARY.forEach(cat => cat.shows.forEach(s => SHOW_LOOKUP[s.id] = s));

        const libraryContainer = document.getElementById('library-container');
        const queueContainer = document.getElementById('playlist-queue');
        const autoplayToggle = document.getElementById('autoplay-toggle');
        const audioPlayerContainer = document.getElementById('audio-player-container');
        const audioPlayer = document.getElementById('main-audio-player');
        const nowPlayingSource = document.getElementById('now-playing-source');
        const nowPlayingTitle = document.getElementById('now-playing-title');
        const nowPlayingDate = document.getElementById('now-playing-date');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const btnRw10 = document.getElementById('btn-rw10');
        const btnFf10 = document.getElementById('btn-ff10');

        // --- SILENT HEARTBEAT ---
        const silentHeartbeat = new Audio("data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA");
        silentHeartbeat.loop = true;
        silentHeartbeat.volume = 0.01;

        let activeQueueOrder = ['npr_now', 'cnn_5', 'wsj_whats'];
        try {
            const savedOrder = localStorage.getItem('newsQueueOrder');
            if (savedOrder) {
                const parsed = JSON.parse(savedOrder);
                if (Array.isArray(parsed)) activeQueueOrder = parsed;
            }
        } catch(e) { }

        let autoplayEnabled = false;
        try {
            const savedAuto = localStorage.getItem('newsAutoplay');
            if (savedAuto) autoplayEnabled = (JSON.parse(savedAuto) === true);
        } catch(e) { }
        
        let loadedTracksData = []; 
        let currentTrackIndex = -1;

        // Syncs lock-screen state
        function handleUserPlay() {
            silentHeartbeat.play().catch(() => {});
            audioPlayer.play().catch(e => console.log(e));
            if ('mediaSession' in navigator) {
                navigator.mediaSession.playbackState = 'playing';
            }
        }

        function handleUserPause() {
            audioPlayer.pause();
            silentHeartbeat.pause();
            if ('mediaSession' in navigator) {
                navigator.mediaSession.playbackState = 'paused';
            }
        }

        function initApp() {
            // Wake up heartbeat on the user's first tap
            const startHeartbeat = () => {
                silentHeartbeat.play().catch(() => {});
                document.removeEventListener('click', startHeartbeat);
            };
            document.addEventListener('click', startHeartbeat);

            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible' && loadedTracksData.length > 0) {
                    refreshPlaylistQueue({ fetchNewData: false });
                }
            });
            
            autoplayToggle.checked = autoplayEnabled;
            autoplayToggle.addEventListener('change', (e) => {
                autoplayEnabled = e.target.checked;
                localStorage.setItem('newsAutoplay', JSON.stringify(autoplayEnabled));
            });

            btnRw10.addEventListener('click', () => { audioPlayer.currentTime = Math.max(0, audioPlayer.currentTime - 10); });
            btnFf10.addEventListener('click', () => { audioPlayer.currentTime = Math.min(audioPlayer.duration || 0, audioPlayer.currentTime + 10); });
            btnPrev.addEventListener('click', advanceQueuePrev);
            btnNext.addEventListener('click', advanceQueueNext);

            if ('mediaSession' in navigator) {
                navigator.mediaSession.setActionHandler('play', handleUserPlay);
                navigator.mediaSession.setActionHandler('pause', handleUserPause);
                navigator.mediaSession.setActionHandler('previoustrack', advanceQueuePrev);
                navigator.mediaSession.setActionHandler('nexttrack', advanceQueueNext);
                navigator.mediaSession.setActionHandler('seekbackward', () => {
                    audioPlayer.currentTime = Math.max(0, audioPlayer.currentTime - 10);
                });
                navigator.mediaSession.setActionHandler('seekforward', () => {
                    audioPlayer.currentTime = Math.min(audioPlayer.duration || 0, audioPlayer.currentTime + 10);
                });
            }

            buildLibrarySelector();
            initSortableEngine();
            refreshPlaylistQueue();
        }

        function buildLibrarySelector() {
            libraryContainer.innerHTML = '';
            
            FULL_LIBRARY.forEach((cat, index) => {
                // Sort the shows alphabetically within this category
                const sortedShows = [...cat.shows].sort((a, b) => a.name.localeCompare(b.name));

                // Create a collapsible <details> element
                const details = document.createElement('details');
                // Open the first category by default, leave the rest closed
                if (index === 0) details.setAttribute('open', '');
                details.className = "group bg-slate-50 rounded-lg border border-slate-200 overflow-hidden";

                // Create the clickable header
                const summary = document.createElement('summary');
                summary.className = "text-xs font-bold text-blue-900 p-3 cursor-pointer select-none flex justify-between items-center hover:bg-slate-100 transition list-none [&::-webkit-details-marker]:hidden";
                summary.innerHTML = `
                    <span class="flex items-center space-x-2">
                        <span class="w-1 h-3 bg-blue-900 rounded-full"></span>
                        <span>${cat.category}</span>
                    </span>
                    <svg class="w-4 h-4 text-slate-400 group-open:rotate-180 transition-transform duration-200" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path></svg>
                `;
                
                // Create the grid for the newly sorted checkboxes
                const listGrid = document.createElement('div');
                listGrid.className = "grid grid-cols-1 gap-1.5 p-2 bg-white border-t border-slate-200";

                sortedShows.forEach(show => {
                    const checked = activeQueueOrder.includes(show.id);
                    const label = document.createElement('label');
                    label.className = "flex items-center space-x-3 p-1.5 hover:bg-slate-50 rounded-lg cursor-pointer text-xs select-none";
                    label.innerHTML = `
                        <input type="checkbox" data-id="${show.id}" ${checked ? 'checked' : ''} 
                               class="w-4 h-4 text-blue-600 border-slate-300 rounded focus:ring-blue-500">
                        <span class="text-slate-700 font-medium">${show.name}</span>
                    `;
                    label.querySelector('input').addEventListener('change', toggleShowSelection);
                    listGrid.appendChild(label);
                });

                details.appendChild(summary);
                details.appendChild(listGrid);
                libraryContainer.appendChild(details);
            });
        }

        function initSortableEngine() {
            Sortable.create(queueContainer, {
                animation: 150,
                handle: '.drag-handle',
                onEnd: () => {
                    let currentPlayingId = null;
                    if (currentTrackIndex >= 0 && currentTrackIndex < loadedTracksData.length) {
                        currentPlayingId = loadedTracksData[currentTrackIndex].id;
                    }

                    const currentCards = queueContainer.querySelectorAll('[data-queue-id]');
                    activeQueueOrder = Array.from(currentCards).map(card => card.getAttribute('data-queue-id'));
                    localStorage.setItem('newsQueueOrder', JSON.stringify(activeQueueOrder));
                    
                    loadedTracksData.sort((a, b) => {
                        return activeQueueOrder.indexOf(a.id) - activeQueueOrder.indexOf(b.id);
                    });

                    if (currentPlayingId) {
                        currentTrackIndex = loadedTracksData.findIndex(t => t.id === currentPlayingId);
                    }

                    setTimeout(() => {
                        refreshPlaylistQueue({ fetchNewData: false }); 
                    }, 50);
                }
            });
        }

        function toggleShowSelection(e) {
            const id = e.target.getAttribute('data-id');
            if (e.target.checked) {
                if (!activeQueueOrder.includes(id)) activeQueueOrder.push(id);
            } else {
                activeQueueOrder = activeQueueOrder.filter(item => item !== id);
            }
            localStorage.setItem('newsQueueOrder', JSON.stringify(activeQueueOrder));
            refreshPlaylistQueue();
        }


async function fetchFeedItem(showId) {
            const show = SHOW_LOOKUP[showId];
            if (!show) return null;

            // Helper function to safely parse and convert dates across different API formats
            const parseDate = (pubDateStr, isUtcAssumed) => {
                if (!pubDateStr) return "";
                let dateStr = pubDateStr.replace(/-/g, '/');
                if (isUtcAssumed && !dateStr.includes('UTC') && !dateStr.includes('+')) {
                    dateStr += ' UTC';
                }
                return new Date(dateStr).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            };

            try {
                // TRY 1: The standard rss2json API
                const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(show.url)}`);
                const data = await response.json();
                
                if (data.status === 'ok' && data.items && data.items.length > 0) {
                    const item = data.items[0];
                    if (item.enclosure?.link) {
                        return { id: showId, sourceName: show.name, episodeTitle: item.title || show.name, audioUrl: item.enclosure.link, time: parseDate(item.pubDate, true) };
                    }
                }
                throw new Error("RSS2JSON failed or blocked");
            } catch (e1) {
                console.log(`rss2json blocked for ${show.name}, trying Factmaven API...`);
                
                try {
                    // TRY 2: Factmaven API (A secondary, stealthier RSS-to-JSON service)
                    const res2 = await fetch(`https://api.factmaven.com/xml-to-json/?xml=${encodeURIComponent(show.url)}`);
                    const data2 = await res2.json();
                    
                    const item = data2?.rss?.channel?.item?.[0] || data2?.rss?.channel?.item;
                    if (item && item.enclosure) {
                        const audioUrl = item.enclosure.url || item.enclosure['@attributes']?.url;
                        if (audioUrl) {
                            return { id: showId, sourceName: show.name, episodeTitle: item.title || show.name, audioUrl: audioUrl, time: parseDate(item.pubDate, false) };
                        }
                    }
                    throw new Error("Factmaven failed or blocked");
                } catch (e2) {
                    console.log(`Factmaven blocked for ${show.name}, trying AllOrigins wrapper...`);
                    
                    try {
                        // TRY 3: AllOrigins /get wrapper (Wraps data in JSON to prevent CORS crashes)
                        const res3 = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(show.url)}`);
                        const data3 = await res3.json();
                        
                        // Check if we got XML, and ensure it isn't a Cloudflare Captcha page
                        if (data3.contents && !data3.contents.includes("<title>Just a moment...</title>")) {
                            const parser = new DOMParser();
                            const xmlDoc = parser.parseFromString(data3.contents, "text/xml");
                            const item = xmlDoc.querySelector("item");
                            
                            if (item) {
                                let audioUrl = item.querySelector("enclosure")?.getAttribute("url") || 
                                               item.querySelector("content, [nodeName='media:content']")?.getAttribute("url");
                                if (audioUrl) {
                                    const title = item.querySelector("title")?.textContent || show.name;
                                    const pubDate = item.querySelector("pubDate")?.textContent || "";
                                    return { id: showId, sourceName: show.name, episodeTitle: title, audioUrl: audioUrl, time: parseDate(pubDate, false) };
                                }
                            }
                        }
                    } catch (e3) {
                        console.error(`All fallbacks totally blocked for ${show.name}`);
                    }
                }
            }
            
            // If all 3 APIs are blocked by Cloudflare, gracefully show this instead of crashing the UI
            return { id: showId, sourceName: show.name, episodeTitle: "Feed temporarily blocked by publisher firewall", audioUrl: null, time: "" };
        }        
        async function refreshPlaylistQueue(options = { fetchNewData: true }) {
            if (activeQueueOrder.length === 0) {
                queueContainer.innerHTML = '<p class="text-slate-400 text-xs italic text-center py-4">Your queue is empty.</p>';
                audioPlayerContainer.classList.add('hidden');
                return;
            }

            if (options.fetchNewData) {
                queueContainer.innerHTML = '<p class="text-blue-600 text-xs animate-pulse text-center py-4">Validating RSS endpoints & loading latest tracks...</p>';
                const tracks = [];
                for (const showId of activeQueueOrder) {
                    const t = await fetchFeedItem(showId);
                    if (t) tracks.push(t);
                }
                loadedTracksData = tracks;
            }

            queueContainer.innerHTML = '';
            loadedTracksData.forEach((track, index) => {
                const isPlayable = track.audioUrl !== null;
                const card = document.createElement('div');
                card.setAttribute('data-queue-id', track.id);
                card.className = `bg-white p-2.5 rounded-lg border shadow-sm flex items-center space-x-3 transition ${index === currentTrackIndex ? 'border-blue-500 bg-blue-50/40' : 'border-slate-200'}`;
                
                card.innerHTML = `
                    <div class="drag-handle text-slate-400 cursor-grab active:cursor-grabbing p-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 8h16M4 16h16"></path></svg>
                    </div>
                    <div class="truncate flex-1">
                        <div class="flex items-center space-x-1.5">
                            <span class="text-[10px] text-white bg-slate-400 rounded-full w-4 h-4 flex items-center justify-center font-bold font-mono shrink-0">${index + 1}</span>
                            <h3 class="font-bold text-slate-900 text-xs truncate">${track.sourceName}</h3>
                        </div>
                        <p class="text-[11px] text-slate-500 truncate ml-5.5">${track.episodeTitle}</p>
                    </div>
                    <div class="shrink-0 flex items-center space-x-2 text-right">
                        <div class="flex flex-col items-end">
                            <span class="text-[7px] font-bold uppercase tracking-wider text-slate-400 mb-0.5">Published</span>
                            <span class="text-[10px] text-slate-600 font-medium">${track.time}</span>
                        </div>
                        <button ${!isPlayable ? 'disabled' : ''} class="play-btn bg-blue-600 hover:bg-blue-700 disabled:bg-slate-200 text-white rounded-full p-1.5 shadow-sm transition">
                            <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        </button>
                    </div>
                `;

                if (isPlayable) {
                    card.querySelector('.play-btn').addEventListener('click', (e) => {
                        e.stopPropagation();
                        playIndex(index);
                    });
                }
                queueContainer.appendChild(card);
            });

            if (options.fetchNewData && autoplayEnabled && loadedTracksData.length > 0) {
                autoplayEnabled = false; 
                const firstValidIndex = loadedTracksData.findIndex(t => t.audioUrl !== null);
                if (firstValidIndex !== -1) {
                    playIndex(firstValidIndex);
                }
            }
            updateNavigationButtons();
        }

        function playIndex(index) {
            if (index < 0 || index >= loadedTracksData.length) return;
            currentTrackIndex = index;
            const track = loadedTracksData[index];

            if (!track.audioUrl) {
                advanceQueueNext();
                return;
            }

            if (silentHeartbeat.paused) {
                silentHeartbeat.play().catch(() => {});
            }

            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: track.episodeTitle,
                    artist: track.sourceName,
                    album: 'My News Briefing'
                });
                navigator.mediaSession.playbackState = 'playing';
            }

            audioPlayer.src = track.audioUrl;
            audioPlayer.play().catch(err => console.log("Waiting on interaction:", err));

            audioPlayerContainer.classList.remove('hidden');
            nowPlayingSource.textContent = track.sourceName.toUpperCase();
            nowPlayingTitle.textContent = track.episodeTitle;
            nowPlayingDate.textContent = track.time;

            if (document.visibilityState === 'visible') {
                refreshPlaylistQueue({ fetchNewData: false });
            }
            updateNavigationButtons();
        }

        function advanceQueueNext() {
            const nextIndex = currentTrackIndex + 1;
            if (nextIndex < loadedTracksData.length) {
                playIndex(nextIndex);
            } else {
                audioPlayer.pause();
                audioPlayer.currentTime = 0;
                silentHeartbeat.pause();
                if ('mediaSession' in navigator) {
                    navigator.mediaSession.playbackState = 'none';
                }
            }
        }

        function advanceQueuePrev() {
            if (currentTrackIndex > 0) playIndex(currentTrackIndex - 1);
        }

        function updateNavigationButtons() {
            btnPrev.disabled = currentTrackIndex <= 0;
            btnNext.disabled = currentTrackIndex === -1 || currentTrackIndex >= loadedTracksData.length - 1;
            btnPrev.style.opacity = btnPrev.disabled ? "0.3" : "1";
            btnNext.style.opacity = btnNext.disabled ? "0.3" : "1";
        }

        audioPlayer.addEventListener('error', (e) => {
            console.warn("Track failed to load, skipping...", e);
            advanceQueueNext();
        });
        audioPlayer.addEventListener('ended', advanceQueueNext);

        initApp();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW fail:', err));
            });
        }
    </script>
</body>
</html>
